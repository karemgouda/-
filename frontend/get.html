<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Books</h1>

    <div id="booksList"></div>

    <script>
        // Function to fetch all books from the backend API
        const fetchAllBooks = async () => {
            try {
                const response = await axios.get('http://localhost:5000/api/books');
                const books = response.data;
                displayBooks(books);
            } catch (error) {
                console.error('Error fetching books:', error.response.data);
                // Display error message to user
            }
        };

        // Function to display all books in the UI
        const displayBooks = (books) => {
            const booksList = document.getElementById('booksList');
            books.forEach(book => {
                const bookElement = document.createElement('div');
                bookElement.innerHTML = `
                    <h2>${book.title}</h2>
                    <p><strong>Author:</strong> ${book.author.firstName} ${book.author.lastName}</p>
                    <p><strong>Description:</strong> ${book.description}</p>
                    <p><strong>Price:</strong> ${book.price}</p>
                `;
                booksList.appendChild(bookElement);
            });
        };

        // Call fetchAllBooks function when the page loads
        window.onload = fetchAllBooks;
    </script>
</body>
</html>
