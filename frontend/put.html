<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="put.css">
</head>
<body>

    <!-- Form for updating a book -->
    <h2>Update Book</h2>
    <form id="updateBookForm">
        <label for="bookId">Book ID:</label>
        <input type="text" id="bookId" name="bookId" required><br><br>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required><br><br>
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required><br><br>
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" required><br><br>
        <label for="price">Price:</label>
        <input type="number" id="price" name="price" required><br><br>
        <button type="submit">Update Book</button>
    </form>
    <script>
        // Function to update a book
        document.getElementById('updateBookForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const bookId = document.getElementById('bookId').value;
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const description = document.getElementById('description').value;
            const price = document.getElementById('price').value;

            try {
                const response = await axios.put(`http://localhost:5000/api/books/${bookId}`, {
                    title,
                    author,
                    description,
                    price
                });
                console.log('Book updated successfully:', response.data);
                // Update UI or display success message
            } catch (error) {
                console.error('Error updating book:', error.response.data);
                // Display error message to user
            }
        });
    </script>    
</body>
</html>
